name: Patch stop button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''    async def stop(self):
        self.running = False
        self.stopped = True
        self.reason = "Manually stopped"
        setstate("phase", "saving")
        await checkpoint(True)
        setstate("phase", "stopped")
'''
          new = '''    async def stop(self):
        if not self.running:
            self.stopped = True
            self.reason = "Already stopped"
            setstate("phase", "stopped")
            return
        self.reason = "Stopping safely after the current numerical operation..."
        setstate("phase", "stopping")
        self.running = False
        self.stopped = True
        await checkpoint(True)
        setstate("phase", "stopped")
'''
          if old in s:
              s = s.replace(old, new, 1)
          old_js = "async function stopSearch(){try{render(await(await fetch('/api/stop',{method:'POST'})).json())}catch(e){$('error').textContent=String(e)}}"
          new_js = '''async function stopSearch(){const button=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('Stop'));if(button){button.disabled=true;button.textContent='■ Stopping…';}try{const r=await fetch('/api/stop',{method:'POST',cache:'no-store'});render(await r.json());}catch(e){$('error').textContent=String(e);}finally{if(button){button.disabled=false;button.textContent='■ Stop & Save';}}}'''
          if old_js in s:
              s = s.replace(old_js, new_js, 1)
          old_phase = "if(p==='stopped')return'Stopped and saved';"
          new_phase = "if(p==='stopping')return'Stopping safely…';if(p==='stopped')return'Stopped and saved';"
          if old_phase in s:
              s = s.replace(old_phase, new_phase, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || (git commit -m 'Fix stop button responsiveness' && git push)
